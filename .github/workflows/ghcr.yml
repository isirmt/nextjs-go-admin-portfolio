name: Build and Push Images

on:
  push:
    branches: [master]
    paths:
      - VERSION

  workflow_dispatch:
    inputs:
      push_latest:
        description: "push :latest tag"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from VERSION
        id: version
        run: |
          VERSION=$(< VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push (${{ matrix.service }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: web
            context: ./frontend
          - service: backend
            context: ./backend
          - service: embedding
            context: ./embedding
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check version tag exists
        id: check
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        if: steps.check.outputs.exists != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          flavor: |
            latest=false

      - name: Build and push version tag
        uses: docker/build-push-action@v5
        if: steps.check.outputs.exists != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ matrix.service == 'web' && secrets.SENTRY_AUTH_TOKEN || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-latest:
    name: Publish latest tags
    needs: [prepare, build-and-push]
    if: github.event_name == 'push' || inputs.push_latest
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for service in web backend embedding; do
            docker buildx imagetools create \
              --tag "$IMAGE_PREFIX-$service:latest" \
              "$IMAGE_PREFIX-$service:$VERSION"
          done
