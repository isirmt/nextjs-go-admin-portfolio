name: check build

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      embedding: ${{ steps.filter.outputs.embedding }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          for area in frontend backend embedding; do
            if printf '%s\n' "$files" | grep -q "^$area/"; then
              echo "$area=true" >> "$GITHUB_OUTPUT"
            fi
          done
          images=$(printf '%s\n' "$files" | awk -F/ '$1 == "frontend" { web=1 } $1 == "backend" { backend=1 } $1 == "embedding" { embedding=1 } END { printf "["; sep=""; if (web) { printf "%s\"web\"", sep; sep="," } if (backend) { printf "%s\"backend\"", sep; sep="," } if (embedding) { printf "%s\"embedding\"", sep } printf "]" }')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$files" | grep -Eq '^(db/|compose\.dev\.yml$)'; then
            echo 'migrations=true' >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**/*', 'frontend/public/**/*', 'frontend/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Run build
        working-directory: frontend
        run: pnpm build

      - name: Run Storybook build
        working-directory: frontend
        run: pnpm build-storybook

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run go test
        working-directory: backend
        run: go test ./...

  test-migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start database
        run: docker compose -f compose.dev.yml up -d db

      - name: Run migrations
        run: docker compose -f compose.dev.yml run --rm migrate

      - name: Stop database
        if: always()
        run: docker compose -f compose.dev.yml down -v

  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service == 'web' && 'frontend' || matrix.service }}
          file: ./${{ matrix.service == 'web' && 'frontend' || matrix.service }}/Dockerfile
          push: false
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
