<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一時的にご利用いただけません | isirmt.com</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      background: #fff;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #555;
      font-size: clamp(2.5rem, 10vw, 3.75rem);
      font-weight: 900;
      line-height: 1;
    }

    p {
      margin: 0;
      color: #555;
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1.5;
    }

    a {
      border-bottom: 1px solid currentColor;
      color: #361ea5;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
    }

    a:hover {
      color: #8e80cc;
    }
  </style>
</head>

<body>
  <main>
    <h1>503 Service Unavailable</h1>
    <p>更新作業中です。しばらくしてから再度お試しください。</p>

</html>
